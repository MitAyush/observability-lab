[SERVICE]
    Flush                     10
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf

    # Enable filesystem buffering
    storage.path              /var/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     256

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

    # Enable filesystem buffering for this input
    storage.type      filesystem

[OUTPUT]
    Name                es
    Match               docker.payment-service
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     payment-logs
    Suppress_Type_Name  On
    Retry_Limit         False

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        docker
    Reserve_Data  On
    Preserve_Key  Off