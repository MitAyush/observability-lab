[SERVICE]
    Flush         10
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/app/app.log
    Tag               go.app
    Parser            app_json
    Read_from_Head    true
    Inotify_Watcher   false
    Refresh_Interval  10

[OUTPUT]
    Name                es
    Match               go.app
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     payment-logs
    Suppress_Type_Name  On
    Retry_Limit         False