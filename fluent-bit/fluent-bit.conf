[SERVICE]
    Flush         10
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[OUTPUT]
    Name                es
    Match               docker.payment-service
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     payment-logs
    Suppress_Type_Name  On
    Retry_Limit         False

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        docker
    Reserve_Data  On
    Preserve_Key  Off